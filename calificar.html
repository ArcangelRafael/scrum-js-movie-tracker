<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calificar Películas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="calificar.js"></script>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">CineRater</a>
  </nav>

  <section class="hero">
    <div class="container">
      <h1>Califica tus películas favoritas</h1>
      <p>Comparte tu opinión y ayuda a otros cinéfilos</p>
    </div>
  </section>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Nueva Calificación</h2>
            <div class="mb-3">
              <input type="text" id="pelicula" class="form-control" placeholder="Nombre de la película" />
            </div>
            <div class="mb-3">
              <input type="number" id="puntuacion" min="1" max="5" class="form-control" placeholder="Puntuación (1-5)" />
            </div>
            <div class="d-grid">
              <button id="btnCalificar" class="btn btn-warning">Enviar Calificación</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 CineRater. Todos los derechos reservados.
  </footer>
</body>
</html>
