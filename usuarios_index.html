<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="login.js"></script>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">CineRater</a>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Iniciar sesión o registrarse</h2>
            <div class="mb-3">
              <input type="email" id="email" class="form-control" placeholder="Correo electrónico" />
            </div>
            <div class="mb-3">
              <input type="password" id="password" class="form-control" placeholder="Contraseña" />
            </div>
            <div class="d-grid gap-2">
              <button id="btnRegister" class="btn btn-primary">Registrarse</button>
              <button id="btnLogin" class="btn btn-success">Iniciar Sesión</button>
              <button id="btnGoogle" class="btn btn-danger">Entrar con Google</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 CineRater. Todos los derechos reservados.
  </footer>
</body>
</html>
